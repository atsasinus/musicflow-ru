apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.chaquo.python'

// Local release signing credentials stay outside the repository.
def signingPropertiesPath = project.findProperty("musicflowSigningProperties") ?: System.getenv("MUSICFLOW_SIGNING_PROPERTIES")
def fichierCle = signingPropertiesPath ? file(signingPropertiesPath) : rootProject.file("signing.properties")
def proprietesCle = new Properties()
if (fichierCle.exists()) { fichierCle.withInputStream { proprietesCle.load(it) } }
def chaquopyBuildPython = project.findProperty("chaquopyPython") ?: System.getenv("CHAQUOPY_PYTHON")

android {
    signingConfigs {
        release {
            if (fichierCle.exists()) {
                def keystorePath = proprietesCle.getProperty("storeFile")
                if (keystorePath) {
                    def keystoreFile = new File(keystorePath)
                    storeFile(keystoreFile.isAbsolute() ? keystoreFile : new File(fichierCle.parentFile, keystorePath))
                }
                storePassword proprietesCle["storePassword"]
                keyAlias proprietesCle["keyAlias"]
                keyPassword proprietesCle["keyPassword"]
            }
        }
    }
    namespace 'com.musicflow.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.musicflow.app"
        minSdk 26
        targetSdk 35
        versionCode 29
        versionName "3.4.0"

        ndk {
            // abiFilters restricted to the most common architectures to reduce the APK size
            // Note: armeabi-v7a costs ~8 MB (native + stdlib + Chaquopy requirements
            // are duplicated per architecture) and pushes the APK over the
            // 30 MB upload limit, which then requires another delivery channel.
            abiFilters "arm64-v8a"
        }

        python {
            version "3.13"
            if (chaquopyBuildPython) {
                buildPython chaquopyBuildPython
            }
            pip {
                install "yt-dlp"
                install "flask"
                install "certifi"
                install "mutagen"  // cover art + audio tags (m4a/mp3/opus) without ffmpeg
                install "Pillow"   // converts the thumbnail (webp/png...) to JPEG for the cover art
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    // ffmpeg (with LAME/FLAC): conversion to the chosen format + silence removal
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.9'
}
